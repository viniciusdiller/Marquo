# Exemplo de nginx para o Marquo (frontend em marquo.com.br, API em api.marquo.com.br).
# Copie para /etc/nginx/sites-available/marquo, troque os valores marcados com TROQUE e valide com `nginx -t`.
# (`http2 on;` exige nginx 1.25.1 ou mais novo. Em versões anteriores, apague essa linha e use `listen 443 ssl http2;`.)
#
# O que este arquivo garante (e o que o backend assume):
#  - X-Forwarded-For é SOBRESCRITO com o IP real da conexão (nunca somado ao que o cliente mandou). Sem isso,
#    qualquer pessoa forja o IP e burla o limite de tentativas de login. Combina com TRUST_PROXY_HOPS=1 no backend
#    e TRUSTED_PROXY_HOPS=1 no frontend.
#  - Host e X-Forwarded-Proto repassados (o login do Auth.js monta os links com eles).
#  - As portas 3001 (API) e 3004 (site) ficam em 127.0.0.1: só o nginx as alcança. Feche-as também no firewall.
#  - /plataforma (painel interno do site) só abre para o seu IP; /internal/ (API de suporte) só para o IP do Admin.

# Cabeçalhos repetidos em todo proxy_pass abaixo.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ───────── HTTP: tudo vai para HTTPS ─────────
server {
    listen 80;
    listen [::]:80;
    server_name marquo.com.br www.marquo.com.br api.marquo.com.br;
    return 301 https://$host$request_uri;
}

# ───────── www -> domínio principal ─────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.marquo.com.br;

    ssl_certificate     /etc/letsencrypt/live/marquo.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marquo.com.br/privkey.pem;

    return 301 https://marquo.com.br$request_uri;
}

# ───────── Site (Next.js, porta 3004) ─────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name marquo.com.br;

    ssl_certificate     /etc/letsencrypt/live/marquo.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marquo.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Upload de logo/foto passa pelo site (Server Action com teto de 6 MB, ver next.config.ts).
    client_max_body_size 8m;

    # Painel interno da plataforma: só o seu IP. TROQUE pelo(s) IP(s) fixo(s) de quem administra.
    # Se o seu IP mudar, você perde o acesso: use uma VPN com IP fixo, ou acesse pelo servidor via túnel SSH.
    location /plataforma {
        allow 203.0.113.10;   # TROQUE
        deny  all;
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}

# ───────── API (NestJS, porta 3001) ─────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.marquo.com.br;

    ssl_certificate     /etc/letsencrypt/live/marquo.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marquo.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 8m;

    # API interna de suporte (assinada por HMAC): só o IP do Admin. Se não usa o Admin-TotalSoftware, bloqueie tudo.
    location /internal/ {
        allow 198.51.100.20;  # TROQUE pelo IP do Admin (ou apague esta linha para bloquear todos)
        deny  all;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ATENÇÃO: não restrinja /platform/ por IP aqui. O site (Next) chama essa API pelo servidor, então a origem
    # seria o IP do próprio servidor, e o painel pararia de funcionar. A proteção de /platform/ é o token + o
    # bloqueio de /plataforma acima.

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
