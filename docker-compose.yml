services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - marquo_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  postgres:
    image: postgres:16-alpine
    container_name: totalagenda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: totalagenda_app
      POSTGRES_PASSWORD: totalagenda_dev
      POSTGRES_DB: totalagenda_dev
    ports:
      - "5432:5432"
    volumes:
      - totalagenda_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U totalagenda_app -d totalagenda_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  marquo_redis:
  totalagenda_pgdata:
