name: CI

# Roda em todo PR para a main e a cada push na main. Não precisa de banco nem de segredos: os testes de backend usam
# Prisma mockado, e o build do frontend não chama a API.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # A versão do pnpm vem do campo "packageManager" do package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # Dependência com vulnerabilidade conhecida bloqueia o merge. A única exceção é a documentada em
      # pnpm.auditConfig.ignoreGhsas (package.json raiz).
      - name: Auditoria de dependências
        run: pnpm audit --prod

      - name: Lint
        run: |
          pnpm --filter backend lint:check
          pnpm --filter frontend lint

      # O build gera o client do Prisma antes de compilar o backend (turbo.json: ^db:generate).
      - name: Build
        run: pnpm build

      - name: Testes do backend
        run: pnpm --filter backend test

      - name: Testes do frontend
        run: pnpm --filter frontend test
